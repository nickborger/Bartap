name: Deploy to Oracle Cloud

on:
push:
branches: [main]
workflow_dispatch:

concurrency:
group: deploy-oracle
cancel-in-progress: true

jobs:
deploy:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

- uses: actions/setup-node@v4
with:
node-version: 22
cache: npm

- name: Install
run: npm ci

- name: Type check
run: npm run lint

- name: Build
run: npm run build

- name: Copy dist to the Oracle VM
env:
ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
ORACLE_USER: ${{ secrets.ORACLE_USER }}
ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
run: |
if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_USER" ] || [ -z "$ORACLE_SSH_KEY" ]; then
echo "Oracle secrets are not set yet, so the build passed but nothing was deployed."
exit 0
fi
mkdir -p ~/.ssh
printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
chmod 600 ~/.ssh/oracle_key
ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
rsync -az --delete -e "ssh -i ~/.ssh/oracle_key" dist/ "$ORACLE_USER@$ORACLE_HOST:/var/www/bartap/"
echo "Deployed to $ORACLE_HOST"
